services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sohano
      POSTGRES_PASSWORD: sohano
      POSTGRES_DB: sohano
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sohano"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://sohano:sohano@db:5432/sohano
      SECRET_KEY: ${SECRET_KEY:-change-me-to-a-long-random-string}
      LLM_PROVIDER: ${LLM_PROVIDER:-anthropic}
      LLM_MODEL: ${LLM_MODEL:-claude-sonnet-4-6}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      FRONTEND_ORIGIN: http://localhost:8080
      UPLOAD_DIR: /app/uploads
    volumes:
      - uploads:/app/uploads

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  pgdata:
  uploads:
